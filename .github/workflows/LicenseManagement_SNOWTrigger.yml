name: O365 License Management

on:
  repository_dispatch:
    types: [LicenseManagement]

defaults:
  run:
    shell: pwsh

jobs:
  LicenseManagement:
    if: ${{ github.event.client_payload.category == 'LicenseManagement' }}
    runs-on: windows-latest

    steps:

      # -------------------------------------------------
      # 1.1 Debug: Print Client Payload
      # -------------------------------------------------
      - name: Print Client Payload
        shell: pwsh
        run: |
          $category = "${{ github.event.client_payload.category }}"
          $actionType = "${{ github.event.client_payload.ActionType }}"
          $upn = "${{ github.event.client_payload.UserPrincipalName }}"
          $licenseName = "${{ github.event.client_payload.LicenseName }}"
          $sysId = "${{ github.event.client_payload.sys_id }}"

          Write-Host "===== CLIENT PAYLOAD ====="
          Write-Host "Category: $category"
          Write-Host "ActionType: $actionType"
          Write-Host "UserPrincipalName: $upn"
          Write-Host "LicenseName: $licenseName"
          Write-Host "sys_id: $sysId"
          Write-Host "=========================="

      # -------------------------------------------------
      # 2. Checkout repository
      # -------------------------------------------------
      - name: Checkout O365_Automations Branch
        uses: actions/checkout@v4
        with:
          ref: main

      # -------------------------------------------------
      # 3. Run License Management Script
      # -------------------------------------------------
      - name: Run License Management Script
        id: run_license
        env:
          TENANT_ID_COE: ${{ secrets.AZ_TENANT_ID_AutoCoe }}
          CLIENT_ID_COE: ${{ secrets.AZ_CLIENT_ID_AutoCoe }}
          CLIENT_SECRET_COE: ${{ secrets.AZ_SECRET_AutoCoe }}
          VALID_DOMAIN: ${{ secrets.VALID_DOMAIN }}
        shell: pwsh
        run: |
          $action = "${{ github.event.client_payload.ActionType }}"
          $upn = "${{ github.event.client_payload.UserPrincipalName }}"
          $sku = "${{ github.event.client_payload.LicenseName }}"

          # Run the script and capture output
          $result = & ./Scripts/LicenseManagement/LicenseManagement.ps1 `
            -TenantId $env:TENANT_ID_COE `
            -ClientId $env:CLIENT_ID_COE `
            -ClientSecret $env:CLIENT_SECRET_COE `
            -UserPrincipalName $upn `
            -LicenseSkuId $sku `
            -ActionType $action 2>&1 | Out-String

          # Fallback for no output
          if (-not $result) {
            $result = "WORKNOTES:: Script returned no output.`nERRORFLAG:: True"
          }

          # Extract clean outputs (safe)
          $worknotes = ""
          $errorflag = ""

          foreach ($line in $result -split "`n") {
              if ($line -match "^WORKNOTES::") {
                  $worknotes = $line.Replace("WORKNOTES::","").Trim()
              }
              elseif ($line -match "^ERRORFLAG::") {
                  $errorflag = $line.Replace("ERRORFLAG::","").Trim()
              }
          }

          # Fallback values
          if (-not $worknotes) { $worknotes = "No worknotes returned." }
          if (-not $errorflag) { $errorflag = "True" }

          # Send clean output to GitHub Actions
          "worknotes=$worknotes" >> $env:GITHUB_OUTPUT
          "errorflag=$errorflag" >> $env:GITHUB_OUTPUT

      # -------------------------------------------------
      # 4. Update RITM in ServiceNow
      # -------------------------------------------------
      - name: Update RITM in ServiceNow
        if: ${{ github.event.client_payload.sys_id != '' }}
        shell: pwsh
        env:
          SNOW_USER: ${{ secrets.SNOW_USER }}
          SNOW_PASS: ${{ secrets.SNOW_PASS }}
          SYS_ID: ${{ github.event.client_payload.sys_id }}
          WORKNOTES: ${{ steps.run_license.outputs.worknotes }}
          ERRORFLAG: ${{ steps.run_license.outputs.errorflag }}
        run: |
          Write-Host "DEBUG → WORKNOTES = '$($env:WORKNOTES)'"
          Write-Host "DEBUG → ERRORFLAG = '$($env:ERRORFLAG)'"

          $state = "3"  # Closed
          $assigned_to = $null

          if (
            $env:ERRORFLAG -eq "False"
          ) {
            Write-Host "Setting RITM state to Pending (-5) due to error or existing license."
            $state = "-5"
            $assignment_group = "d625dccec0a8016700a222a0f7900d06"
          }

          # Build JSON body
          $bodyHash = @{
            state      = $state
            work_notes = $env:WORKNOTES
          }

          if ($assigned_to) {
            $bodyHash["assigned_to"] = $assigned_to
          }

          $body = $bodyHash | ConvertTo-Json

          $cred = New-Object System.Management.Automation.PSCredential(
            $env:SNOW_USER,
            (ConvertTo-SecureString $env:SNOW_PASS -AsPlainText -Force)
          )

          Invoke-RestMethod -Method Patch `
            -Uri "https://ven04628.service-now.com/api/now/table/sc_req_item/$($env:SYS_ID)" `
            -Credential $cred `
            -Headers @{ "Content-Type"="application/json" } `
            -Body $body

          Write-Host "ServiceNow RITM updated successfully → State: $state"
