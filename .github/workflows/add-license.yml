name: Add M365 License Trigger

on:
  repository_dispatch:
    types: [assign_license]

jobs:
  run-license-automation:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Add License Script
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          Write-Host "🟢 Received Payload:"
          Write-Host "   UserPrincipalName:  ${{ github.event.client_payload.UserPrincipalName }}"
          Write-Host "   LicenseSkuId:       ${{ github.event.client_payload.LicenseSkuId }}"
          
          $upn = "${{ github.event.client_payload.UserPrincipalName }}"
          $sku = "${{ github.event.client_payload.LicenseSkuId }}"

          Write-Host "🚀 Running add-license.ps1..."

          pwsh "$env:GITHUB_WORKSPACE/add-license.ps1" `
            -TenantId $env:TENANT_ID `
            -ClientId $env:CLIENT_ID `
            -ClientSecret $env:CLIENT_SECRET `
            -UserPrincipalName $upn `
            -LicenseSkuId $sku
