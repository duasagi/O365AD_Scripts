name: Add M365 License Trigger

on:
  workflow_dispatch:
    inputs:
      userPrincipalName:
        description: "UserPrincipalName"
        required: true
      licenseSku:
        description: "License SKU ID"
        required: true

  repository_dispatch:
    types: [assign_license]

jobs:
  run-license-automation:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Add License Script
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          # Fetch UPN & SKU — Works for BOTH triggers
          $upn = if ("${{ github.event.inputs.userPrincipalName }}" -ne "") {
              "${{ github.event.inputs.userPrincipalName }}"
          } else {
              "${{ github.event.client_payload.UserPrincipalName }}"
          }

          $sku = if ("${{ github.event.inputs.licenseSku }}" -ne "") {
              "${{ github.event.inputs.licenseSku }}"
          } else {
              "${{ github.event.client_payload.LicenseSkuId }}"
          }

          Write-Host "🟢 Final UserPrincipalName: $upn"
          Write-Host "🟢 Final LicenseSkuId: $sku"

          pwsh "$env:GITHUB_WORKSPACE/add-license.ps1" `
            -TenantId $env:TENANT_ID `
            -ClientId $env:CLIENT_ID `
            -ClientSecret $env:CLIENT_SECRET `
            -UserPrincipalName $upn `
            -LicenseSkuId $sku
